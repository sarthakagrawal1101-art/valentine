<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Valentine’s 💖</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #ffb6c1, #ffd1dc);
      overflow: hidden;
    }

    /* Floating hearts background */
    .hearts-bg span {
      position: absolute;
      bottom: -50px;
      font-size: 18px;
      opacity: 0.3;
      animation: floatUp 12s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.4; }
      to { transform: translateY(-110vh); opacity: 0; }
    }

    /* Center text */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
    }

    .center-text h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      color: #ffffff;
      text-shadow: 0 8px 30px rgba(255, 0, 80, 0.4);
      animation: glow 3s ease-in-out infinite;
    }

    .center-text p {
      margin-top: 12px;
      font-size: 1.1rem;
      color: #fff;
      opacity: 0.95;
    }

    @keyframes glow {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Photo container */
    .photos {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .photo {
      position: absolute;
      width: 150px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(255, 0, 90, 0.35);
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo:hover { transform: scale(1.03); }

    /* Heart burst */
    .burst {
      position: absolute;
      pointer-events: none;
      animation: burst 0.8s ease-out forwards;
    }

    @keyframes burst {
      from { transform: scale(0); opacity: 1; }
      to { transform: scale(2.2); opacity: 0; }
    }

    /* Footer text */
    .signature {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-family: 'Pacifico', cursive;
      color: rgba(255,255,255,0.85);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="valentine">
    <h1 class="main-text">Happy Valentine’s Day</h1>
    <p class="sub-text">You are mine. Always & forever 🫂</p>

    <div class="photo-grid">
      <img src="photo1.jpg" class="photo tilt-1" />
      <img src="photo2.jpg" class="photo tilt-2" />
      <img src="photo3.jpg" class="photo tilt-3" />
      <img src="photo4.jpg" class="photo tilt-4" />
    </div>

    <div class="signature">— yours, forever 💕</div>
  </div>

  <script>
    document.querySelectorAll('.photo').forEach(p => {
      p.addEventListener('click', e => {
        const burst = document.createElement('div');
        burst.className = 'heart-burst';
        p.appendChild(burst);
        setTimeout(()=>burst.remove(),600);
      });
    });
  </script>
</body>
</html>
