<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Valentine’s Day – Polaroid</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #ffd1dc, #ffb6c1);
  font-family: 'Playfair Display', serif;
  overflow: hidden;
}

.card {
  max-width: 430px;
  margin: auto;
  padding: 20px;
  height: 100vh;
  position: relative;
}

/* Center Text */
.center-text {
  text-align: center;
  margin-top: 20px;
  position: relative;
  z-index: 2;
}

.center-text h1 {
  font-family: 'Pacifico', cursive;
  font-size: 38px;
  text-shadow: 0 0 10px rgba(255,255,255,0.8);
  margin-bottom: 6px;
}

.center-text p {
  font-size: 17px;
}

.nickname {
  font-family: 'Pacifico', cursive;
  font-size: 20px;
  color: #b03060;
  margin-top: 6px;
}

.infinity {
  font-size: 20px;
  opacity: 0.7;
}

/* Polaroid Area */
.polaroids {
  margin-top: 30px;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 18px;
  position: relative;
  z-index: 2;
}

/* Polaroid Frame */
.polaroid {
  width: 140px;
  background: white;
  padding: 10px 10px 22px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.25);
  border-radius: 6px;
  position: relative;
  transition: transform 0.4s ease;
}

.polaroid img {
  width: 100%;
  height: 160px;
  object-fit: cover;
  border-radius: 3px;
}

.caption {
  margin-top: 8px;
  font-size: 13px;
  text-align: center;
  opacity: 0.75;
}

/* Floating Hearts */
.heart {
  position: absolute;
  bottom: -20px;
  font-size: 16px;
  opacity: 0.7;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  10% { opacity: 0.8; }
  100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
}

/* Footer */
.footer {
  position: absolute;
  bottom: 14px;
  width: 100%;
  text-align: center;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="card">

  <!-- Floating Hearts -->
  <div class="heart" style="left:12%; animation-duration:9s;">💗</div>
  <div class="heart" style="left:32%; animation-duration:11s;">💖</div>
  <div class="heart" style="left:55%; animation-duration:10s;">💞</div>
  <div class="heart" style="left:75%; animation-duration:12s;">💘</div>

  <!-- Text -->
  <div class="center-text">
    <h1>Happy Valentine’s Day 💖</h1>
    <p>Forever yours. Always mine 🫶</p>
    <div class="nickname">— Puchki 💕</div>
    <div class="infinity">∞</div>
  </div>

  <!-- Polaroids -->
  <div class="polaroids">
    <div class="polaroid">
      <img src="photo1.jpg">
      <div class="caption">Us 🤍</div>
    </div>
    <div class="polaroid">
      <img src="photo2.jpg">
      <div class="caption">My favorite</div>
    </div>
    <div class="polaroid">
      <img src="photo5.jpg">
      <div class="caption">Always</div>
    </div>
    <div class="polaroid">
      <img src="photo4.jpg">
      <div class="caption">Forever</div>
    </div>
  </div>

  <div class="footer">14 February</div>

</div>

<!-- RANDOM POLAROID TILT -->
<script>
document.querySelectorAll('.polaroid').forEach(card => {
  const rotate = Math.random() * 10 - 5; // -5° to +5°
  const shiftX = Math.random() * 10 - 5;
  const shiftY = Math.random() * 10 - 5;
  card.style.transform = 
    `rotate(${rotate}deg) translate(${shiftX}px, ${shiftY}px)`;
});
</script>

</body>
</html>
