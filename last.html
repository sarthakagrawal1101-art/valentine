<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Valentine’s 💖</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Quicksand', sans-serif;
      background: linear-gradient(180deg, #ffb6c1, #ffd1dc);
      overflow: hidden;
    }

    /* Floating hearts background */
    .hearts-bg span {
      position: absolute;
      bottom: -50px;
      font-size: 18px;
      opacity: 0.3;
      animation: floatUp 12s linear infinite;
    }

    @keyframes floatUp {
      from { transform: translateY(0); opacity: 0; }
      20% { opacity: 0.4; }
      to { transform: translateY(-110vh); opacity: 0; }
    }

    /* Center text */
    .center-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 5;
    }

    .center-text h1 {
      font-family: 'Pacifico', cursive;
      font-size: 3rem;
      color: #ffffff;
      text-shadow: 0 8px 30px rgba(255, 0, 80, 0.4);
      animation: glow 3s ease-in-out infinite;
    }

    .center-text p {
      margin-top: 12px;
      font-size: 1.1rem;
      color: #fff;
      opacity: 0.95;
    }

    @keyframes glow {
      0%,100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    /* Photo container */
    .photos {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .photo {
      position: absolute;
      width: 150px;
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 18px 40px rgba(255, 0, 90, 0.35);
      cursor: pointer;
      transition: transform 0.25s ease;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .photo:hover { transform: scale(1.03); }

    /* Heart burst */
    .burst {
      position: absolute;
      pointer-events: none;
      animation: burst 0.8s ease-out forwards;
    }

    @keyframes burst {
      from { transform: scale(0); opacity: 1; }
      to { transform: scale(2.2); opacity: 0; }
    }

    /* Footer text */
    .signature {
      position: absolute;
      bottom: 20px;
      width: 100%;
      text-align: center;
      font-family: 'Pacifico', cursive;
      color: rgba(255,255,255,0.85);
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- Floating hearts -->
  <div class="hearts-bg">
    <span style="left:10%;animation-delay:0s">💖</span>
    <span style="left:30%;animation-delay:2s">💗</span>
    <span style="left:50%;animation-delay:4s">💞</span>
    <span style="left:70%;animation-delay:1s">❤️</span>
    <span style="left:90%;animation-delay:3s">💓</span>
  </div>

  <!-- Photos -->
  <div class="photos">
    <div class="photo" style="top:12%; left:8%; transform: rotate(-3deg);">
      <img src="photo1.jpg" />
    </div>
    <div class="photo" style="top:10%; right:10%; transform: rotate(4deg); width:170px;">
      <img src="photo2.jpg" />
    </div>
    <div class="photo" style="bottom:18%; left:12%; transform: rotate(2deg);">
      <img src="photo3.jpg" />
    </div>
    <div class="photo" style="bottom:12%; right:8%; transform: rotate(-4deg); width:180px;">
      <img src="photo4.jpg" />
    </div>
  </div>

  <!-- Center Message -->
  <div class="center-text">
    <h1>Happy Valentine’s Day</h1>
    <p>You are mine. Always & forever 🫂</p>
  </div>

  <!-- Signature -->
  <div class="signature">— yours, forever 💕</div>

  <script>
    // Heart burst on photo tap
    document.querySelectorAll('.photo').forEach(photo => {
      photo.addEventListener('click', e => {
        const heart = document.createElement('div');
        heart.className = 'burst';
        heart.innerText = '💖';
        heart.style.left = e.offsetX + 'px';
        heart.style.top = e.offsetY + 'px';
        photo.appendChild(heart);
        setTimeout(() => heart.remove(), 800);
      });
    });
  </script>
</body>
</html>
