<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Valentine’s Day</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #ffd1dc, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  overflow: hidden;
}

.card {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  padding: 22px 18px;
  box-sizing: border-box;
  position: relative;
}

/* Center Text */
.center-text {
  text-align: center;
  margin-top: 25px;
  z-index: 2;
  position: relative;
}

.center-text h1 {
  font-family: 'Pacifico', cursive;
  font-size: 38px;
  text-shadow: 0 0 10px rgba(255,255,255,0.8);
  margin-bottom: 8px;
}

.center-text p {
  font-size: 17px;
}

.nickname {
  font-family: 'Pacifico', cursive;
  font-size: 19px;
  color: #b03060;
  margin-top: 6px;
}

.infinity {
  font-size: 20px;
  opacity: 0.7;
}

/* Photo Area */
.photos {
  margin-top: 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  position: relative;
  z-index: 2;
}

/* Smaller Frames */
.photo {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 18px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 10px 20px rgba(0,0,0,0.25);
  transition: transform 0.4s ease;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* Floating Hearts */
.heart {
  position: absolute;
  bottom: -20px;
  font-size: 16px;
  opacity: 0.7;
  animation: floatUp linear infinite;
}

@keyframes floatUp {
  0% { transform: translateY(0) scale(1); opacity: 0; }
  10% { opacity: 0.8; }
  100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
}

/* Footer */
.footer {
  position: absolute;
  bottom: 16px;
  width: 100%;
  text-align: center;
  font-size: 13px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="card">

  <!-- Floating Hearts -->
  <div class="heart" style="left:10%; animation-duration:8s;">💗</div>
  <div class="heart" style="left:30%; animation-duration:10s;">💖</div>
  <div class="heart" style="left:50%; animation-duration:9s;">💞</div>
  <div class="heart" style="left:70%; animation-duration:11s;">💘</div>
  <div class="heart" style="left:85%; animation-duration:9.5s;">💓</div>

  <!-- Text -->
  <div class="center-text">
    <h1>Happy Valentine’s Day 💖</h1>
    <p>Forever yours. Always mine 🫶</p>
    <div class="nickname">— Puchki 💕</div>
    <div class="infinity">∞</div>
  </div>

  <!-- Photos -->
  <div class="photos">
    <div class="photo"><img src="photo1.jpg"></div>
    <div class="photo"><img src="photo2.jpg"></div>
    <div class="photo"><img src="photo3.jpg"></div>
    <div class="photo"><img src="photo4.jpg"></div>
  </div>

  <div class="footer">14 February</div>

</div>

<!-- RANDOM FRAME SCRIPT -->
<script>
const photos = document.querySelectorAll('.photo');

photos.forEach(photo => {
  const rotate = Math.floor(Math.random() * 7) - 3; // -3° to +3°
  const offsetX = Math.floor(Math.random() * 6) - 3;
  const offsetY = Math.floor(Math.random() * 6) - 3;
  const radius = Math.floor(Math.random() * 8) + 14;

  photo.style.transform = 
    `rotate(${rotate}deg) translate(${offsetX}px, ${offsetY}px)`;
  photo.style.borderRadius = `${radius}px`;
});
</script>

</body>
</html>
