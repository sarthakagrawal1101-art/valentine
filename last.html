<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Valentine’s Day</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(180deg, #ffd1dc, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  overflow-x: hidden;
}

.card {
  width: 100%;
  max-width: 430px;
  height: 100vh;
  padding: 24px 20px;
  box-sizing: border-box;
  position: relative;
}

/* Title */
.center-text {
  text-align: center;
  margin-top: 30px;
}

.center-text h1 {
  font-family: 'Pacifico', cursive;
  font-size: 40px;
  color: #2b2b2b;
  text-shadow: 0 0 10px rgba(255,255,255,0.8);
  margin-bottom: 12px;
}

.center-text p {
  font-size: 18px;
  color: #3a3a3a;
}

.center-text span {
  display: block;
  margin-top: 8px;
  font-size: 20px;
  opacity: 0.7;
}

/* Photos Grid */
.photos {
  margin-top: 35px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.photo {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 22px;
  overflow: hidden;
  background: #fff;
  box-shadow: 0 12px 25px rgba(0,0,0,0.25);
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(1.05) contrast(1.05);
}

/* Floating Hearts */
.heart {
  position: absolute;
  font-size: 16px;
  opacity: 0.6;
  animation: float 5s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-18px); }
  100% { transform: translateY(0); }
}

/* Footer */
.footer {
  position: absolute;
  bottom: 20px;
  width: 100%;
  text-align: center;
  font-size: 14px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="card">

  <!-- Floating Hearts -->
  <div class="heart" style="top:10%; left:15%;">💗</div>
  <div class="heart" style="top:18%; right:20%;">✨</div>
  <div class="heart" style="top:65%; left:10%;">💞</div>
  <div class="heart" style="top:70%; right:15%;">💖</div>

  <!-- Text -->
  <div class="center-text">
    <h1>Happy Valentine’s Day 💖</h1>
    <p>Forever yours. Always mine 🫶</p>
    <span>∞</span>
  </div>

  <!-- Photos -->
  <div class="photos">
    <div class="photo">
      <img src="photo1.jpg" alt="Memory 1">
    </div>
    <div class="photo">
      <img src="photo2.jpg" alt="Memory 2">
    </div>
    <div class="photo">
      <img src="photo3.jpg" alt="Memory 3">
    </div>
    <div class="photo">
      <img src="photo4.jpg" alt="Memory 4">
    </div>
     <div class="photo">
      <img src="photo5.jpeg" alt="Memory 4">
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">14 February</div>

</div>

</body>
</html>
