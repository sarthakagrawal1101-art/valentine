<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Happy Valentine’s Day</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #ffd1dc, #ffb6c1);
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Playfair Display', serif;
  overflow: hidden;
}

.card {
  width: 90%;
  max-width: 1100px;
  height: 600px;
  background: rgba(255, 255, 255, 0.25);
  backdrop-filter: blur(8px);
  border-radius: 30px;
  position: relative;
  box-shadow: 0 20px 40px rgba(0,0,0,0.15);
  padding: 40px;
}

/* Center Text */
.center-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}

.center-text h1 {
  font-family: 'Pacifico', cursive;
  font-size: 56px;
  color: #2b2b2b;
  text-shadow: 0 0 12px rgba(255,255,255,0.8);
  margin-bottom: 15px;
}

.center-text p {
  font-size: 20px;
  color: #3a3a3a;
}

.center-text span {
  font-size: 18px;
  display: block;
  margin-top: 10px;
  opacity: 0.8;
}

/* Photo Frames */
.photo {
  width: 180px;
  height: 230px;
  border-radius: 22px;
  overflow: hidden;
  position: absolute;
  box-shadow: 0 15px 30px rgba(0,0,0,0.25);
  background: #fff;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(1.05) contrast(1.05);
}

/* Photo Positions */
.photo.left-top { top: 40px; left: 40px; }
.photo.left-bottom { bottom: 40px; left: 60px; transform: rotate(-2deg); }
.photo.right-top { top: 50px; right: 60px; }
.photo.right-bottom { bottom: 50px; right: 40px; }

/* Floating Hearts */
.heart {
  position: absolute;
  font-size: 18px;
  opacity: 0.6;
  animation: float 6s infinite ease-in-out;
}

@keyframes float {
  0% { transform: translateY(0); }
  50% { transform: translateY(-20px); }
  100% { transform: translateY(0); }
}

.footer {
  position: absolute;
  bottom: 20px;
  right: 30px;
  font-size: 14px;
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="card">

  <!-- Photos -->
  <div class="photo left-top">
    <img src="photo1.jpg" alt="Memory 1">
  </div>

  <div class="photo left-bottom">
    <img src="photo2.jpg" alt="Memory 2">
  </div>

  <div class="photo right-top">
    <img src="photo3.jpg" alt="Memory 3">
  </div>

  <div class="photo right-bottom">
    <img src="photo4.jpg" alt="Memory 4">
  </div>

  <!-- Center Text -->
  <div class="center-text">
    <h1>Happy Valentine’s Day 💖</h1>
    <p>Forever yours. Always mine 🫶</p>
    <span>∞</span>
  </div>

  <!-- Floating Hearts -->
  <div class="heart" style="top:10%; left:45%;">💗</div>
  <div class="heart" style="top:25%; left:60%;">✨</div>
  <div class="heart" style="top:70%; left:40%;">💞</div>
  <div class="heart" style="top:60%; left:55%;">💖</div>

  <!-- Footer -->
  <div class="footer">14 February</div>

</div>

</body>
</html>
