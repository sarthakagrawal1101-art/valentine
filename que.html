<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Will You Be My Valentine?</title>

<style>
  * {
    box-sizing: border-box;
    font-family: "Poppins", system-ui, sans-serif;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(180deg, #ffd1dc, #ffb6c1);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .card {
    background: #fff5f8;
    width: 100%;
    max-width: 360px;
    border-radius: 24px;
    padding: 22px;
    text-align: center;
    box-shadow: 0 15px 40px rgba(255,105,135,.35);
  }

  h1 {
    font-size: 26px;
    color: #a2336e;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 14px;
    color: #7a2e4d;
    margin-bottom: 12px;
  }

  .teddy {
    width: 120px;
    margin: 12px auto;
    transition: transform .3s ease;
  }

  .teddy.shock { transform: scale(1.1) rotate(-6deg); }
  .teddy.angry { transform: scale(1.15) rotate(6deg); }

  .roast {
    font-size: 13px;
    color: #7a2e4d;
    margin-bottom: 14px;
    min-height: 20px;
    transition: opacity .3s;
  }

  .choice-box {
    position: relative;
    width: 100%;
    height: 150px;
    border: 2px dashed #f4a6c1;
    border-radius: 18px;
    margin-top: 12px;
    overflow: hidden;
  }

  .btn {
    border: none;
    border-radius: 999px;
    padding: 12px 22px;
    font-size: 15px;
    cursor: pointer;
    transition: transform .2s ease;
  }

  .yes {
    background: linear-gradient(135deg, #ff5f9e, #ff85b3);
    color: white;
    margin-top: 14px;
  }

  .no {
    background: #e9f3ff;
    color: #333;
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
  }

  .no.shake {
    animation: shake .3s;
  }

  @keyframes shake {
    0% { transform: translate(-50%, -50%) rotate(0); }
    25% { transform: translate(-48%, -50%) rotate(-3deg); }
    50% { transform: translate(-52%, -50%) rotate(3deg); }
    100% { transform: translate(-50%, -50%) rotate(0); }
  }

  .final {
    background: #ffd6e6 !important;
    color: #a2336e !important;
    pointer-events: none;
  }
</style>
</head>

<body>

<div class="card">
  <h1>Will you be my Valentine? 💖</h1>
  <div class="subtitle">Be careful… the “No” button is dramatic 😶</div>

  <img src="teddy-hug.gif" alt="Teddy Hug" class="teddy" id="teddy">

  <p class="roast" id="roast">
    Teddy believes in us 🧸
  </p>

  <button class="btn yes" onclick="goNext()">YES 💘</button>

  <div class="choice-box" id="box">
    <button class="btn no" id="noBtn">NO 😭</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const box = document.getElementById("box");
const roast = document.getElementById("roast");
const teddy = document.getElementById("teddy");

let count = 0;

const roasts = [
  "Nice try 😏",
  "That NO is running from love 🏃‍♀️💖",
  "Even teddy is judging you 🧸",
  "Stop bullying the NO button 😭",
  "Fate already decided 💘",
  "Gravity says YES 🌍",
  "Okay this is getting suspicious 😈"
];

noBtn.addEventListener("mouseenter", escape);

function escape() {
  count++;

  const maxX = box.clientWidth - noBtn.offsetWidth;
  const maxY = box.clientHeight - noBtn.offsetHeight;

  const x = Math.random() * maxX;
  const y = Math.random() * maxY;

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  noBtn.classList.add("shake");
  setTimeout(() => noBtn.classList.remove("shake"), 300);

  roast.style.opacity = 0;
  setTimeout(() => {
    roast.textContent = roasts[Math.min(count - 1, roasts.length - 1)];
    roast.style.opacity = 1;
  }, 200);

  teddy.classList.remove("shock", "angry");
  if (count < 4) teddy.classList.add("shock");
  else teddy.classList.add("angry");

  // FINAL BOSS MOMENT
  if (count >= 7) {
    noBtn.textContent = "Okay fine 😭";
    noBtn.classList.add("final");
    roast.textContent = "NO has accepted its fate 💀💖";
  }
}

function goNext() {
  window.location.href = "final.html"; // 🔗 last page
}
</script>

</body>
</html>
