<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Important Question 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Quicksand',sans-serif;
  background:linear-gradient(135deg,#ffb6d5,#ffd1e8);
  overflow:hidden;
}
.container{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:20px;
}
.question{
  font-family:'Pacifico',cursive;
  font-size:2.4rem;
  color:#c2185b;
}
.roast{
  margin-top:10px;
  font-size:1rem;
  color:#7a1b3a;
  min-height:24px;
}
.teddy{
  width:160px;
  margin:25px 0 15px;
  transition:transform .4s ease;
}
.buttons{
  position:relative;
  width:280px;
  height:120px;
}
button{
  position:absolute;
  padding:14px 26px;
  font-size:1.1rem;
  border:none;
  border-radius:30px;
  cursor:pointer;
}
#yesBtn{
  left:0;
  right:0;
  margin:auto;
  bottom:0;
  background:#e91e63;
  color:#fff;
}
#noBtn{
  background:#fff;
  color:#e91e63;
  border:2px dashed #e91e63;
  top:0;
  left:80px;
  transition:.2s;
}
/* hearts */
.heart{
  position:fixed;
  font-size:22px;
  animation:floatUp 1.8s ease-out forwards;
}
@keyframes floatUp{
  from{opacity:1;transform:translateY(0) scale(.6)}
  to{opacity:0;transform:translateY(-140px) scale(1.4)}
}
.fade-out{animation:fadeOut 1.3s forwards}
@keyframes fadeOut{to{opacity:0;transform:scale(1.03)}}
</style>
</head>
<body>
<div class="container" id="page">
  <div class="question">Will you be my Valentine? 💘</div>
  <div class="roast" id="roast">Think carefully… your heart already knows 😌</div>
  <img src="https://tenor.com/p75v6eGMM8a.gif" class="teddy" id="teddy" alt="teddy">

  <div class="buttons" id="btnBox">
    <button id="noBtn">No 🙃</button>
    <button id="yesBtn" onclick="ultimateYes()">Yes 💖</button>
  </div>
</div>

<audio id="yesMusic">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const noBtn=document.getElementById('noBtn');
const roast=document.getElementById('roast');
const teddy=document.getElementById('teddy');
const box=document.getElementById('btnBox');

const roasts=[
  "Oops… missed it 😏",
  "Nice try but destiny said no 😌",
  "Are you sure?",
  "Button shy ho gaya 🫣",
  "Are you flirting with the NO button? 😒",
  "My heart removed that option 💖"
];

noBtn.addEventListener('mouseenter',moveNo);
noBtn.addEventListener('click',moveNo);

function moveNo(){
  const maxX=box.clientWidth-noBtn.offsetWidth;
  const maxY=box.clientHeight-noBtn.offsetHeight;
  const x=Math.random()*maxX;
  const y=Math.random()*maxY;
  noBtn.style.left=x+'px';
  noBtn.style.top=y+'px';
  roast.innerText=roasts[Math.floor(Math.random()*roasts.length)];
  teddy.style.transform='scale(1.15) rotate('+(Math.random()*10-5)+'deg)';
}

function ultimateYes(){
  const music=document.getElementById('yesMusic');
  music.volume=.9;music.play();
  teddy.style.transform='scale(1.35)';

  for(let i=0;i<30;i++){
    setTimeout(()=>{
      const h=document.createElement('div');
      h.className='heart';
      h.innerText=['💖','💗','💕','💘'][Math.floor(Math.random()*4)];
      h.style.left=Math.random()*100+'vw';
      h.style.bottom='20px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(),1800);
    },i*40);
  }

  document.getElementById('page').classList.add('fade-out');
  setTimeout(()=>{window.location.href='last.html'},1500);
}
</script>
</body>
</html>
